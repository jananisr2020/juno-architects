name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Enforce compressed asset budgets
        run: node scripts/check-bundle.mjs
      - name: Check accessibility contract
        run: node scripts/check-a11y-contract.mjs

  backend:
    name: Backend tests and migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
          JUNO_AUTO_CREATE_TABLES: "false"
        run: pytest -q
      - name: Validate Alembic migration graph and apply migrations
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          python -m compileall -q backend
          alembic heads
          alembic upgrade head
